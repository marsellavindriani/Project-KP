        <div class="form-group mt-4">

    <script>
        // JavaScript function to mimic loadModel function behavior
        function loadModel() {
            const choiceUser = document.getElementById('deviceChoice').value;
            let deviceName = "cpu";
            let modelPath = "Default";
            let modelInput = "Auto selection";

            if (choiceUser === "null") {
                if (isCudaAvailable()) {
                    console.log("Prediction Using CUDA!");
                    deviceName = "0";
                } else {
                    console.log("Prediction Using CPU!");
                    deviceName = "cpu";
                }
            } else {
                console.log(`Prediction Using CUDA: ${choiceUser}`);
                deviceName = choiceUser;
            }

            // Update HTML content
            document.getElementById('deviceName').textContent = deviceName === "cpu" ? "CPU" : `CUDA ${deviceName}`;
            document.getElementById('modelPath').textContent = modelPath;
            document.getElementById('modelInput').textContent = deviceName === "cpu" ? "Using CPU" : `Using CUDA on GPU: ${deviceName}`;
        }

        // Simulate CUDA availability (for demonstration purposes)
        function isCudaAvailable() {
            // Simulate CUDA availability for demonstration purposes
            return Math.random() > 0.5; // Randomly simulate CUDA being available
        }

        // Initial load
        loadModel();
    </script>
