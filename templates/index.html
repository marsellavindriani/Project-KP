<body>
    <div class="container mt-5">
        <div class="callout" id="deviceInfo">
            <h4>Device Information</h4>
            <p><strong>Device:</strong> <span id="deviceName">Loading...</span></p>
            <p><strong>Model Name:</strong> <span id="modelPath">No file selected</span></p>
            <p><strong>Input Model:</strong> <span id="modelInput">Loading...</span></p>
        </div>
        <div class="form-group mt-4">
            <label for="deviceChoice">Select Device (GPU):</label>
            <select id="deviceChoice" class="form-control" onchange="loadModel()">
                <option value="null">CUDA 0</option>
                <option value="0">CUDA 1</option>
                <option value="1">CPU</option>
            </select>
        </div>
        <form id="modelUploadForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="modelFile" class="form-label">Upload Model (.pt)</label>
                <input class="form-control" type="file" id="modelFile" accept=".pt" onchange="handleFileSelect(event)">
            </div>
            <button type="button" class="btn btn-primary" id="uploadButton" onclick="uploadModel()">Upload</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const deviceName = document.getElementById('deviceName');
            const modelPath = document.getElementById('modelPath');
            const modelInput = document.getElementById('modelInput');
            const deviceChoice = document.getElementById('deviceChoice');

            // Simulate loading device information
            deviceName.textContent = "CUDA 0";
            modelInput.textContent = "N/A";

            // Handle model file selection
            function handleFileSelect(event) {
                const file = event.target.files[0];
                if (file) {
                    modelPath.textContent = file.name;
                } else {
                    modelPath.textContent = "No file selected";
                }
            }

            // Handle model upload (dummy function for illustration)
            function uploadModel() {
                const fileInput = document.getElementById('modelFile');
                const file = fileInput.files[0];
                if (file) {
                    alert(`Uploading model: ${file.name}`);
                    // Here you would handle the actual upload process, e.g., sending the file to a server
                    modelInput.textContent = "Model successfully uploaded!";
                } else {
                    alert("Please select a model file to upload.");
                }
            }

            // Assign functions to window scope for access
            window.handleFileSelect = handleFileSelect;
            window.uploadModel = uploadModel;

            // Load model based on device choice (dummy function)
            window.loadModel = function() {
                const device = deviceChoice.value;
                if (device === "null") {
                    deviceName.textContent = "CUDA 0";
                } else if (device === "0") {
                    deviceName.textContent = "CUDA 1";
                } else {
                    deviceName.textContent = "CPU";
                }
            };
        });

        loadModel();
    </script>
    <div class="container mt-5">

                        <p><strong>Device Used:</strong> <span id="deviceInfo">Loading...</span></p>

                        <input type="file" class="form-control" id="modelInput" accept=".pt"/>
                    </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        // JavaScript function to load model information
        function loadModel(choiceUser = null, modelPath = "models/default/best.pt") {
            let deviceName = "cpu"; // Default device name

            if (choiceUser === null) {
                if (isCudaAvailable()) {
                    console.log("Prediction Using CUDA!");
                    deviceName = "0";
                } else {
                    console.log("Prediction Using CPU!");
                    deviceName = "cpu";
                }
            } else {
                console.log(`Prediction Using CUDA: ${choiceUser}`);
                deviceName = choiceUser;
            }
// Simulate model loading
const modelLoaded = simulateModelLoading(modelPath);

// Update modal content
document.getElementById('deviceInfo').textContent = deviceName === "cpu" ? "CPU" : `GPU ${deviceName}`;
document.getElementById('modelPathInfo').textContent = modelLoaded ? modelPath : "Failed to load model";
}

// Simulate CUDA availability check
function isCudaAvailable() {
return Math.random() > 0.5; // Randomly simulate CUDA being available
}

// Simulate model loading and return success or failure
function simulateModelLoading(modelPath) {
try {
    // Simulate loading a model file (e.g., using AJAX or API call in a real scenario)
    console.log(`Model successfully loaded from ${modelPath}`);
    return true;
} catch (e) {
    console.log(`Failed to load model from ${modelPath}: ${e}`);
    return false;
}
}

// Initial model info load
loadModel();
        
        // JavaScript to update the model path info when a file is selected
        document.getElementById('modelInput').addEventListener('change', function(event) {
            const fileName = event.target.files[0] ? event.target.files[0].name : 'No file selected';
            document.getElementById('modelPathInfo').innerText = fileName;
        });

        // Example JavaScript to load device information
